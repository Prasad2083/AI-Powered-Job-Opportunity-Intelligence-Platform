services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobpulse
      POSTGRES_USER: jobpulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jobpulse_local_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpulse -d jobpulse"]
      interval: 5s
      retries: 10
volumes:
  jobpulse_local_pg:
