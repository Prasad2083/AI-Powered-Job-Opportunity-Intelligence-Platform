name: Verify JobPulse
on:
  push:
    branches: [main, feature/**]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, REST, security, PostgreSQL 16 and Flyway tests
        run: mvn -B -ntp clean verify
      - name: Resolve dependency coordinates
        run: mvn -B -ntp dependency:list -DoutputFile=target/security-dependencies.txt
      - name: Vulnerability scan (OSV, no API key)
        run: python3 scripts/audit-maven.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-verification
          path: |
            target/surefire-reports/
            target/osv-report.json
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - name: Browser workflow with explicitly mocked API
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results/
  full-stack-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Real API, PostgreSQL and browser workflow; Ollama protocol fixture only
        run: bash scripts/run-full-stack-e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-stack-failures
          path: |
            frontend/test-results/
            .local-logs/e2e/
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n start-mac.sh
